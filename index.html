<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI</title>
    <link rel="icon" href="./assets/Raze-Icon-2.png" type="image/jpeg">
    <!-- CSS 库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-vsc-dark-plus.min.css">
    
        <!-- 本地样式 -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- 星空背景 Canvas (新增) -->
<canvas id="star-canvas"></canvas>

<!-- 导航栏 -->
<header>
    <div class="nav-brand" onclick="window.router('home')"><img src="./assets/Raze-Icon-1.png" alt="Logo" class="nav-logo"> PI</div>
    <div class="nav-links">
        <span onclick="window.router('home')" id="nav-home">Home</span>
        <span onclick="window.router('admin')" id="nav-admin">Admin</span>
        <span onclick="window.open('https://github.com', '_blank')"><i class="fab fa-github"></i></span>
    </div>
</header>

<!-- 主容器 -->
<div class="main-container" id="main-container">

    <!-- 1. 主页视图 -->
    <div id="home-view" class="view-section active">
        <div class="home-grid">
            <aside class="left-sidebar">
                <div class="card">
                    <img src="" alt="Avatar" class="profile-img" style="background-color: #eee;">
                    <div class="profile-name">Loading...</div>
                    <div class="profile-bio"></div>
                    <div class="social-links"></div>
                </div>
            </aside>

            <main>
                <div id="filter-status" style="display:none;">
                    筛选: <span id="filter-keyword"></span> 
                    <i class="fas fa-times" onclick="window.app.clearFilter()"></i>
                </div>
                <div id="post-list-container">
                    <div class="card" style="text-align:center; padding: 40px; color: #999;">
                        <i class="fas fa-spinner fa-spin"></i> Loading posts...
                    </div>
                </div>
            </main>

            <aside class="right-sidebar">
                <div class="card">
                    <div class="section-title">Categories</div>
                    <ul class="category-list" id="category-list"></ul>
                </div>
                <div class="card">
                    <div class="section-title">Tags</div>
                    <div class="tag-cloud" id="tag-cloud"></div>
                </div>
            </aside>
        </div>
    </div>

    <!-- 2. 文章详情视图 -->
    <div id="post-view" class="view-section">
        <div class="post-layout">
            <div class="card post-content-card">
                <button onclick="window.router('home')" class="back-btn">
                    <i class="fas fa-arrow-left"></i> 返回列表
                </button>
                <div class="post-header">
                    <h1 class="post-h1" id="single-post-title"></h1>
                    <div class="post-meta" id="single-post-meta"></div>
                </div>
                <div id="markdown-content" class="markdown-body"></div>
            </div>
            
            <aside>
                <div class="card toc-card">
                    <div class="section-title">目录</div>
                    <div class="toc-list" id="toc-list"></div>
                </div>
            </aside>
        </div>
    </div>

    <!-- 3. 管理后台视图 -->
    <div id="admin-view" class="view-section">
        <!-- 登录 -->
        <div id="login-panel" class="login-overlay">
            <div class="login-box">
                <i class="fas fa-user-shield" style="font-size: 3rem; color: var(--accent-color); margin-bottom: 15px;"></i>
                <h3>Admin Access</h3>
                <input type="email" id="admin-email" placeholder="Enter Email">
                <input type="password" id="admin-pwd" placeholder="Enter password" onkeydown="if(event.key==='Enter') window.app.login()">
                <button class="btn" onclick="window.app.login()" style="width:100%">Login Dashboard</button>
            </div>
        </div>

        <!-- 列表 -->
        <div id="admin-dashboard" style="display:none; max-width: 1000px; margin: 0 auto;">
            <div class="admin-dashboard-header">
                <h2><i class="fas fa-tachometer-alt"></i> Dashboard</h2>
                <div style="display:flex; gap:10px; align-items:center;">
                    <span id="user-email-display" style="font-size:0.8rem; color:#666;"></span>
                    <button class="btn" onclick="window.app.newPost()"><i class="fas fa-plus"></i> New Post</button>
                    <button class="btn btn-secondary" onclick="window.app.logout()">Logout</button>
                </div>
            </div>
            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th style="width: 50%">Title</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-post-list"></tbody>
                </table>
            </div>
        </div>

        <!-- 编辑器 -->
        <div id="editor-panel" style="display:none;">
            <div class="editor-container">
                <div class="editor-col">
                    <div class="editor-toolbar">
                        <button class="btn btn-secondary btn-sm" onclick="window.app.showDashboard()">
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                        
                        <!-- 标题输入框 (已移除 display:none) -->
                        <input type="text" id="edit-title-input" placeholder="Enter Post Title...">
                        
                        <button class="btn" id="btn-save" onclick="window.app.savePost()">
                            <i class="fas fa-save"></i> Publish
                        </button>
                    </div>
                    <textarea id="markdown-editor" class="editor-area"></textarea>
                </div>
                <div class="editor-col">
                    <div class="editor-toolbar"><strong>Preview</strong></div>
                    <div id="editor-preview" class="preview-area markdown-body"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- JS 库 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- 自动加载器及其配置 (修复路径问题) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script>
    // 强制指定语言包路径，解决 CDN 路径猜测错误导致自动高亮失败的问题
    if (window.Prism && window.Prism.plugins && window.Prism.plugins.autoloader) {
        window.Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';
    }
</script>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

<!-- 核心业务逻辑 -->
<script type="module" src="./js/app.js"></script>

</body>
</html>
